name: Relato de problema
description: Relatar um problema sem publicar conteúdo ou metadados privados
labels: [bug, needs-triage]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução e comportamento esperado
      description: Descreva passos e resultado sem publicar memórias, metadados, caminhos, exportações ou credenciais reais. Evidência privada permanece no computador.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
